# Device baseline, scoped to our Python 3.12 provisioning and verifier scripts.
line-length = 120
target-version = "py312"
exclude = [".cache", "old", "backup"]
[lint]
select = ["F", "E4", "E7", "E9", "B", "I", "UP", "SIM", "C4", "RUF", "PTH", "PERF", "PIE", "RET", "FURB", "ASYNC", "FAST", "BLE", "PLE", "PLW", "ANN"]
ignore = ["ANN202", "ANN401", "RET504"]
[lint.per-file-ignores]
"**/tests/**" = ["ANN"]
[lint.flake8-annotations]
mypy-init-return = true
