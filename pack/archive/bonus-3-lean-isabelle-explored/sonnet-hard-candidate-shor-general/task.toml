version = "1.0"
# Only the submission crosses into the (fresh, separate) verifier container.
artifacts = ["/app/Shor_General.thy"]
[metadata]
difficulty = "sonnet-hard-candidate"
difficulty_evidence = "oracle 1.0 and nop 0.0 (jobs/lean-oracle-final, jobs/lean-nop-final); no model trial yet with the current setup (metis allowed, 60 min, cap ~1.5x oracle); earlier setup: claude-haiku-5.5 0/1 (jobs/2026-11-03__00-52-43, 30 min, before the Lean reference)"
author_name = "lean-to-isabelle"
category = "theorem-proving"
tags = ["isabelle", "isar", "lean", "quantum", "shor", "first-principles"]
[verifier]
environment_mode = "separate"
timeout_sec = 600.0
[agent]
timeout_sec = 3600.0
[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 6144
storage_mb = 10240

[environment.env]
# Route model calls through the take-home gateway (required by the take-home brief).
ANTHROPIC_BASE_URL = "https://take-home-automation.vercel.app"
ANTHROPIC_API_BASE = "https://take-home-automation.vercel.app"
