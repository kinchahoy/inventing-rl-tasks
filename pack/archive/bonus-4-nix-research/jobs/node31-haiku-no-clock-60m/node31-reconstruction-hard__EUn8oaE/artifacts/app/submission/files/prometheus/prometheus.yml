global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    site: node31
rule_files:
  - /etc/prometheus/rules/rules_*.yml
  - /etc/prometheus/rules/alerts_*.yml
alerting:
  alert_relabel_configs:
    - regex: replica
      action: labeldrop
    - target_label: source
      replacement: prometheus
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
    relabel_configs:
      - target_label: instance
        replacement: node31:9090
  - job_name: alertmanager
    static_configs:
      - targets: ['127.0.0.1:9093']
    relabel_configs:
      - target_label: instance
        replacement: node31:9093
  - job_name: blackbox_exporter
    static_configs:
      - targets: ['127.0.0.1:9115']
    relabel_configs:
      - target_label: instance
        replacement: node31:9115
  - job_name: node
    file_sd_configs:
      - files: ['/etc/prometheus/targets/node_*.yml']
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: hostname
        replacement: '$1'
      - source_labels: [decommissioned]
        regex: 'true'
        action: drop
  - job_name: probe_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/probe_http_*.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
  - job_name: probe_auth
    metrics_path: /probe
    params:
      module: [http_auth_required]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/probe_auth_*.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
  - job_name: probe_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/probe_tcp_*.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
  - job_name: probe_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/probe_icmp_*.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
